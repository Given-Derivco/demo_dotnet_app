# launchpad.yaml — platform manifest for demo dotnet
# Generated by launchpad-deployer scaffolding. Edit & commit changes;
# the platform reads this on every deploy.
name: demo dotnet
port: 8080
healthcheck: /healthz

# Per-app secrets are kept in the platform's age-encrypted store (NOT here).
# Declare the keys you expect; values are injected as env at runtime.
secrets: []
  # - name: APP_SECRET_API_KEY
  #   description: External API key
  #   required: true

# Container paths that need to survive restarts (the platform mounts a
# named volume per path). Leave empty for stateless services.
persistent_paths: []

resources:
  memory: 256Mi
  cpu: "0.5"
